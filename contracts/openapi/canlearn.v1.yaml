components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: __Host-canlearn.session_token
      description: Proposed secure server session; not implemented. Cookie name/config to be bound during
        Better Auth integration.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 规划：随机请求键，按账户/操作/资源域绑定；同键异载荷拒绝。不是授权凭据。
      schema:
        type: string
        minLength: 16
        maxLength: 128
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: 规划：受控浏览器会话的CSRF令牌；另核可信Origin。
      schema:
        type: string
        minLength: 16
        maxLength: 256
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: 规划：读取目标资源得到的单个强ETag；不接受弱标签或通配符作为版本覆盖。
      schema:
        type: string
        pattern: ^"[A-Za-z0-9:_-]+"$
    Limit:
      name: limit
      in: query
      description: 规划：分页条数。
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      description: 规划：不透明游标，绑定账户/权限域/过滤及快照。
      schema:
        type: string
        minLength: 1
        maxLength: 512
    SpaceFilter:
      name: space_id
      in: query
      required: true
      description: 规划：仅过滤已授权空间；此ID不产生授权。
      schema:
        type: string
        format: uuid
    Range:
      name: Range
      in: header
      description: 规划：仅单个字节范围；仍需当前资源授权。
      schema:
        type: string
        pattern: ^bytes=[0-9]*-[0-9]*$
  responses:
    Error400:
      description: Invalid input.
      headers: {}
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Error401:
      description: No valid session.
      headers: {}
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Error403:
      description: Operation or purpose forbidden.
      headers: {}
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Error404:
      description: Resource absent or not visible.
      headers: {}
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Error409:
      description: Business conflict; do not blindly repeat a paid request.
      headers: {}
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Error410:
      description: Authorized owner sees an unavailable resource.
      headers: {}
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Error412:
      description: Strong ETag precondition failed.
      headers: {}
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Error416:
      description: Byte range not satisfiable.
      headers: {}
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Error422:
      description: Request does not satisfy semantic constraints.
      headers: {}
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Error428:
      description: Required version condition missing.
      headers: {}
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Error429:
      description: Rate or capacity limit reached.
      headers:
        Retry-After:
          description: Seconds to wait; retry only when error.retryable is true.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Error503:
      description: Temporarily unavailable; accepted jobs must be queried.
      headers:
        Retry-After:
          description: Seconds to wait; retry only when error.retryable is true.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - service
        - status
      properties:
        service:
          type: string
          enum:
            - canlearn-api
        status:
          type: string
          enum:
            - ok
    Error:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - request_id
        - retryable
      properties:
        code:
          type: string
          enum:
            - INVALID_INPUT
            - UNAUTHENTICATED
            - EMAIL_UNVERIFIED
            - FORBIDDEN
            - NOT_FOUND
            - RESOURCE_GONE
            - IDEMPOTENCY_KEY_REUSED
            - IDEMPOTENCY_IN_PROGRESS
            - VERSION_CONFLICT
            - PRECONDITION_REQUIRED
            - PRECONDITION_FAILED
            - QUOTA_EXCEEDED
            - BUDGET_EXHAUSTED
            - QUALITY_NOT_READY
            - INSUFFICIENT_EVIDENCE
            - JOB_NOT_RETRYABLE
            - UPSTREAM_OUTCOME_UNKNOWN
            - PROVIDER_NOT_ADMITTED
            - TEMPORARILY_UNAVAILABLE
            - RANGE_NOT_SATISFIABLE
        message:
          type: string
          minLength: 1
          maxLength: 256
        request_id:
          type: string
          format: uuid
        retryable:
          type: boolean
        field_errors:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - pointer
              - code
            properties:
              pointer:
                type: string
                minLength: 1
                maxLength: 128
              code:
                type: string
                enum:
                  - required
                  - type
                  - range
                  - unknown_field
                  - format
          minItems: 0
          maxItems: 20
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          $ref: "#/components/schemas/Error"
    VersionRef:
      type: object
      additionalProperties: false
      required:
        - resource_type
        - resource_id
        - version_id
      properties:
        resource_id:
          type: string
          format: uuid
        version_id:
          type: string
          format: uuid
        resource_type:
          type: string
          enum:
            - document
            - source_version
            - page_result
            - question
            - explanation
            - attempt
            - plan_patch
            - plan
            - export
    PageSelection:
