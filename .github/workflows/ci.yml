name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.21.0
          cache: pnpm
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          version: "0.12.15"
      - name: Install TypeScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Python dependencies
        working-directory: apps/workflow
        run: uv sync --frozen
      - name: Validate pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint
      - name: Verify repository
        run: pnpm verify
      - name: Check base branch migrations remain immutable
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/quality_policy.py --base "$PR_BASE_SHA"
      - name: Run local synthetic Job integration
        run: pnpm smoke:test --skip-build
      - name: Preserve synthetic contract and migration evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: synthetic-integration-evidence
          path: |
            /tmp/canlearn-cl013-*/integration-results.json
            /tmp/canlearn-cl013-*/migration-results.json
          if-no-files-found: warn
          retention-days: 14
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - name: Scan secrets, locked dependencies and pinned images
        run: python3 scripts/security_scan.py scan --images
      - name: Prove secret and vulnerable dependency gates reject controlled faults
        run: python3 scripts/security_scan.py probes
      - name: Preserve sanitized security evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-evidence
          path: |
            /tmp/canlearn-security-results/summary.json
            /tmp/canlearn-security-results/probe-results.json
          if-no-files-found: warn
          retention-days: 14
