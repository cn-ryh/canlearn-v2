<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>重置你的 CanLearn 密码</title>
  </head>
  <body style="margin:0;padding:0;background-color:#f3f5f9;color:#172033;font-family:Arial,'Microsoft YaHei',sans-serif;">
    <div style="display:none;max-height:0;overflow:hidden;opacity:0;">设置新的 CanLearn 密码。链接 30 分钟内有效。</div>
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color:#f3f5f9;">
      <tr>
        <td align="center" style="padding:32px 16px;">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:560px;background-color:#ffffff;border:1px solid #e2e8f0;border-radius:12px;">
            <tr>
              <td style="padding:32px 28px 20px;">
                <a href="https://cl.hangxiaonet.com" style="font-size:20px;font-weight:bold;text-decoration:none;color:#2563eb;">CanLearn</a>
              </td>
            </tr>
            <tr>
              <td style="padding:0 28px 28px;">
                <h1 style="margin:0 0 16px;font-size:24px;line-height:1.4;font-weight:bold;">重置你的密码</h1>
                <p style="margin:0 0 12px;font-size:15px;line-height:1.8;">我们收到了重置 CanLearn 密码的请求。点击下方按钮，设置新密码。</p>
                <p style="margin:0 0 24px;font-size:15px;line-height:1.8;">链接有效期为 <strong>30 分钟</strong>。若已过期，请重新发起密码重置。</p>
                <table role="presentation" cellspacing="0" cellpadding="0" border="0">
                  <tr>
                    <td align="center" bgcolor="#2563eb" style="border-radius:6px;">
                      <a href="{{reset_url_html}}" style="display:inline-block;padding:14px 24px;color:#ffffff;text-decoration:none;font-size:15px;font-weight:bold;line-height:1.4;">设置新密码</a>
                    </td>
                  </tr>
                </table>
                <p style="margin:24px 0 8px;font-size:13px;line-height:1.8;color:#64748b;">按钮无法打开？复制下方完整链接到浏览器：</p>
                <p style="margin:0;font-size:12px;line-height:1.8;word-break:break-all;overflow-wrap:anywhere;"><a href="{{reset_url_html}}" style="color:#2563eb;text-decoration:underline;">{{reset_url_html}}</a></p>
              </td>
            </tr>
            <tr>
              <td style="padding:20px 28px;border-top:1px solid #e2e8f0;color:#64748b;font-size:12px;line-height:1.8;">如果这不是你的操作，请忽略此邮件。<br />此邮件由系统发送，请勿直接回复。</td>
            </tr>
          </table>
          <p style="margin:16px 0 0;color:#64748b;font-size:12px;line-height:1.6;">CanLearn · 账户通知</p>
        </td>
      </tr>
    </table>
  </body>
